<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration - Street Vendor Platform</title>
    <link href="styles/collabration.css" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-store"></i> Street Vendor Platform
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="street-vendor-dashboard.html">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="collaboration.html">
                            <i class="fas fa-users"></i> Collaboration
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <i class="fas fa-handshake"></i> Wholesale Collaboration
                </h1>
                <p class="lead">Connect with other vendors for bulk orders and better prices!</p>
            </div>
        </div>

        <!-- Search Section -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="search-box">
                    <input type="text" id="searchVendors" placeholder="Search vendors..." class="form-control">
                </div>
            </div>
            <div class="col-md-4">
                <button id="searchBtn" class="btn btn-primary">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <!-- Vendor List (Dynamically Loaded) -->
        <div class="row">
            <div class="col-12">
                <div id="vendorList">
                    <!-- Vendor cards will be populated via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Active Collaborations Section -->
        <div class="row mt-5">
            <div class="col-12">
                <h3><i class="fas fa-users"></i> Active Collaborations</h3>
                <div id="activeCollaborations">
                    <!-- Active collaborations will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Vendor Details Modal (Hidden by Default) -->
    <div id="vendorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="vendorName">Vendor Name</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="vendorLocation">📍 Exact location after acceptance</p>
                <p id="vendorDescription">Shop description...</p>
                <div class="vendor-products">
                    <h4>Products:</h4>
                    <ul id="vendorProductsList">
                        <!-- Products will be listed here -->
                    </ul>
                </div>
            </div>
            <div class="modal-footer">
                <button id="sendInviteBtn" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Send Invite
                </button>
                <button id="closeModalBtn2" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/common.js"></script>
    <script src="scripts/collaboration.js"></script>
    
    <!-- Initialization script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize your collaboration manager
            if (typeof CollaborationManager !== 'undefined') {
                new CollaborationManager();
            }
        });
    </script>
</body>
</html>
